<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
    <title>Events Erik</title>
</h:head>

<h:body>

    <h2>Ladda upp bild</h2>

    <h:form enctype="multipart/form-data">

        <h:panelGrid columns="2">

            <h:outputLabel for="event" value="Välj event:" />
            <h:selectOneMenu value="#{postBean.selectedId}">
                <f:selectItems value="#{eventBean.events}"
                               var="event"
                               itemValue="#{event.id}"
                               itemLabel="#{event.title}" />
            </h:selectOneMenu>

            <h:outputLabel for="image" value="Bild:" />
            <h:inputFile id="image" value="#{postBean.imageFile}" />

        </h:panelGrid>

        <br/>

        <h:commandButton value="Ladda upp bild"
                         action="#{postBean.createPost}" />

    </h:form>

</h:body>
</html>
