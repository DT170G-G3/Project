<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/templates/admin_base.xhtml">

    <ui:define name="title">Adminpanel - Veckomeny</ui:define>

    <ui:define name="content">
        <!-- Week selector buttons -->
        <h:form>
            <ui:repeat value="#{week.weekNumbers}" var="w">
                <h:commandButton value="V.#{w}"
                                 action="#{week.setWeekNumber(w)}"/>
            </ui:repeat>
        </h:form>

        <!-- For each day, show dishes and allow adding/removing -->
        <ui:repeat value="#{week.daysOfWeek}" var="day">
            <div class="day-box">
                #{day}
            </div>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="Name" />
                    <h:inputText value="#{dish.newDish.name}" required="true" />
                    <h:outputLabel value="Description" />
                    <h:inputText value="#{dish.newDish.description}" />
                    <h:outputLabel value="Price" />
                    <h:inputText value="#{dish.newDish.price}" />
                </h:panelGrid>
                <h:commandButton value="Save"
                                 action="#{lunch.saveToMenu(day)}">
                    <f:ajax execute="@form" render="@all" />
                </h:commandButton>
            </h:form>
            <h:form>
                <ul class="dishList">
                    <ui:repeat value="#{lunch.getLunchDishesByDate(day)}" var="dayDish">
                        <li>#{dayDish.name}
                            <h:commandLink
                                    value="Remove"
                                    action="#{lunch.removeDish(day,dayDish)}">
                                <f:ajax execute="@this" render="@all" />
                            </h:commandLink>
                        </li>
                    </ui:repeat>
                </ul>
            </h:form>
        </ui:repeat>

    </ui:define>

</ui:composition>
