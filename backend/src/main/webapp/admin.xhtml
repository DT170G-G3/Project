<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/templates/admin_base.xhtml">

    <ui:define name="title">Adminpanel - Veckomeny</ui:define>

    <ui:define name="content">
        <div class="menuWrapper">

            <!-- Week selector buttons -->
            <h:form>
                <div class="weekSelector">
                    <ui:repeat value="#{week.weekNumbers}" var="w">
                        <h:commandButton value="V.#{w}"
                                         styleClass="btn #{w == week.weekNumber ? 'btnPrimary' : 'btnSecondary'}"
                                         action="#{week.setWeekNumber(w)}"/>
                    </ui:repeat>
                </div>
            </h:form>

            <div class="contentTitle">Lunchmeny</div>

            <div class="daysList">
                <ui:repeat value="#{week.daysOfWeekLunch}" var="day">
                    <div class="day-card">
                        <div class="day-header">
                            <span class="day-name">#{day}</span>
                        </div>

                        <div class="menu-day-body">

                            <!-- Current dishes as cards -->
                            <h:form>
                                <div class="dishCards">
                                    <ui:repeat value="#{lunch.getLunchDishesByDate(day)}" var="dayDish">
                                        <div class="dishCard">
                                            <h:commandLink styleClass="dishCard-remove"
                                                           action="#{lunch.removeDish(day,dayDish)}">
                                                ✕
                                                <f:ajax execute="@this" render="@all" />
                                            </h:commandLink>
                                            <div class="dishCard-name">#{dayDish.name}</div>
                                            <div class="dishCard-desc">#{dayDish.description}</div>
                                            <div class="dishCard-price">#{dayDish.price} kr</div>
                                        </div>
                                    </ui:repeat>
                                </div>
                            </h:form>

                            <!-- Add a dish to this day -->
                            <h:form>
                                <h:panelGrid columns="2">
                                    <h:outputLabel value="Namn" />
                                    <h:inputText value="#{dish.newDish.name}" required="true" />
                                    <h:outputLabel value="Beskrivning" />
                                    <h:inputText value="#{dish.newDish.description}" />
                                    <h:outputLabel value="Pris" />
                                    <h:inputText value="#{dish.newDish.price}" />
                                </h:panelGrid>
                                <h:commandButton value="Lägg till"
                                                 styleClass="btn btnPrimary"
                                                 action="#{lunch.saveToMenu(day)}">
                                    <f:ajax execute="@form" render="@all" />
                                </h:commandButton>
                            </h:form>

                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>
    </ui:define>

</ui:composition>
