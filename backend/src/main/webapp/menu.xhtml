<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/base.xhtml">

    <ui:define name="title">Á la carte</ui:define>

    <ui:define name="content">

        <div class="panel">
            <h1 class="text-center">Á la cart meny</h1>

            <section class="panel card paper-look paper-torn">
                <ui:repeat value="#{lunch.menuWeek}" var="menu">
                    <div class="text-center">
                        <article class="">
                            <div class="under-line">
                                <h2>#{menu.day}</h2>
                            </div>

                            <ui:repeat value="#{menu.dishes}" var="item">
                                <div class="dish under-line">
                                    <h3>#{item.name}</h3>
                                    <p>#{item.description}</p>
                                </div>
                            </ui:repeat>

                        </article>

                    </div>


                </ui:repeat>
            </section>
        </div>
    </ui:define>

</ui:composition>
