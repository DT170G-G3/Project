<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/base.xhtml">

    <ui:define name="title">Á la carte</ui:define>

    <ui:define name="content">

        <section class="panel paper-look paper-torn">
            <div class="menu-inner">
                <h1 class="text-center">Á la carte meny</h1>

                <ui:repeat value="#{lunch.menuWeek}" var="menu">
                    <article class="menu-category">
                        <h2 class="text-center">#{menu.day}</h2>

                        <div class="menu-items">
                            <ui:repeat value="#{menu.dishes}" var="item">
                                <div class="menu-dish">
                                    <div class="dish-header">
                                        <h3>#{item.name}</h3>
                                        <span class="dish-price">70 kr</span>
                                    </div>
                                    <p>#{item.description}</p>
                                </div>
                            </ui:repeat>
                        </div>
                    </article>
                </ui:repeat>
            </div>
        </section>

    </ui:define>

</ui:composition>
