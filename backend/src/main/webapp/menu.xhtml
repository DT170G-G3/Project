<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                template="/WEB-INF/templates/base.xhtml">

    <ui:define name="title">Á la carte</ui:define>

    <ui:define name="content">
        <h1>Á la carte meny</h1>
        <ui:repeat value="#{lunch.menuWeek }" var="menu">
            <div class="lunch-menu">
                <h2>#{menu.day}</h2>
                <ui:repeat value="#{menu.dishes}" var="item">
                    <h2>#{item.name}</h2>
                    <p>#{item.description}</p>
                </ui:repeat>

            </div>

            <p class="muted">Här lägger vi ut menyn</p>
        </ui:repeat>
    </ui:define>

</ui:composition>
