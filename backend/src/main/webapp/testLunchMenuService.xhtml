<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:f="jakarta.faces.core" xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <meta charset="UTF-8" />
    <title>Eriks Tite3eel</title>
    <h:outputStylesheet library="css" name="style.css?v=${build.version}"/>

</h:head>
<h:body>
    <div class="container">
        <ui:repeat value="#{lunch.lunchDishesToday}" var="menuToday">
            <h2>#{menuToday.name}</h2>
            <p>#{menuToday.description} </p>



        </ui:repeat>
        <h:form>
            <!--  Button demonstrate how the editDish is used. The function require dish id and new description of the dish   -->
            <h:commandButton value="Testa uppdatera dish 10"
                             action="#{lunchMenuService.editDish(10, 'Ändring i rätten')}">
            </h:commandButton>
        </h:form>

        <h:form>
            <!--  Button demonstrate how the removeDishFromMenu is used. Param 10 is dish id and 4 is menu id. -->
            <h:commandButton value="Testa ta bort dish 10"
                             action="#{lunchMenuService.removeDishFromMenu(10, 4)}">
            </h:commandButton>
        </h:form>

        <h1>Test igen om det fungerar, sienna</h1>
        <div id="message-box">
            <ui:repeat value="#{lunch.menuWeek}" var="menu">
                <h2>#{menu.day}</h2>
                <ui:repeat value="#{menu.dishes}" var="item">
                    <h2>#{item.name}</h2>

                    <p>#{item.description}</p>
                    <p>#{item.id}</p>

                </ui:repeat>
            </ui:repeat>

        </div>
    </div>
</h:body>

</html>
