<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/templates/admin.xhtml">

    <ui:define name="title">Anton's Skafferi - Lokala Smaker</ui:define>

    <ui:define name="content">

        <section class="category-grid">
                <h2>TESTING TESTING</h2>

            <!-- Buttons for the current and upcomming weeks -->
            <h:form>
                <ui:repeat value="#{week.weekNumbers}" var="w">
                    <h:commandButton value="V.#{w}" action="#{week.setWeekNumber(w)}"/>
                </ui:repeat>
            </h:form>
            <!-- Adding a dish to the lunchmenueeee -->
            <ui:repeat value="#{week.getDaysOfWeek(w)}" var="day">
                <div class="day-box">
                    #{day}
                </div>
                <h:form>
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Name" />
                        <h:inputText value="#{dish.newDish.name}" required="true" />

                        <h:outputLabel value="Description" />
                        <h:inputText value="#{dish.newDish.description}" />

                        <h:outputLabel value="Price" />
                        <h:inputText value="#{dish.newDish.price}" />

                    </h:panelGrid>
                    <h:commandButton value="Save"
                                     action="#{lunch.saveToMenu(day)}">
                        <f:ajax execute="@form" render="@all" />
                    </h:commandButton>
                </h:form>

                <!-- List up the dishes for the day, and add a remove button. -->
                <h:form>
                    <ul class="dishList">
                        <ui:repeat value="#{lunch.getLunchDishesByDate(day)}" var="dayDish">
                            <li>#{dayDish.name}
                                <h:commandLink
                                        value="Remove"
                                        action="#{lunch.removeDish(day,dayDish)}">
                                    <f:ajax execute="@this" render="@all" />
                                </h:commandLink>
                            </li>
                        </ui:repeat>
                    </ul>
                </h:form>

            </ui:repeat>
        </section>

    </ui:define>

</ui:composition>
