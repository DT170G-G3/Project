<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/admin_base.xhtml">

    <ui:define name="title">Adminpanel - Event</ui:define>
    <ui:define name="content">

        <!-- Listed events -->
        <div class="main-container">
            <div class="event-list-area day-card">

                <h:form id="eventListForm">
                    <h:panelGroup id="eventDisplayArea" layout="block">
                        <div class="day-header">
                            <span class="day-name">
                                #{eventBean.selectedDate == null ? 'Upcoming Events' : eventBean.selectedDate}
                            </span>
                        </div>
                        <!-- Output list of events on selected date-->
                        <ul class="dishList">
                            <ui:repeat value="#{eventBean.eventsForSelectedDate}" var="ev">
                                <li>
                                    <strong>#{ev.title}</strong><br/>
                                    #{ev.description}<br/>
                                    #{ev.startTime}
                                    <h:commandLink value="Ta bort" action="#{eventBean.deleteEvent(ev)}">
                                        <f:ajax render="eventListForm:eventDisplayArea" />
                                    </h:commandLink>
                                </li>
                            </ui:repeat>
                        </ul>
                    </h:panelGroup>
                </h:form>

                <hr/>

                <!-- Add a event to selected date -->
                <h:form>
                    <h3>New Event</h3>
                    <h:panelGrid columns="2">
                        <h:outputLabel value="Name" />
                        <h:inputText value="#{eventBean.newEvent.title}" required="true" styleClass="inputText"/>

                        <h:outputLabel value="Description" />
                        <h:inputTextarea value="#{eventBean.newEvent.description}" styleClass="inputText"/>

                        <h:outputLabel value="Start Time"/>
                        <p:datePicker id="timePicker"
                                      value="#{eventBean.eventTime}"
                                      timeOnly="true"
                                      pattern="HH:mm"
                                      showTime="true">
                            <f:convertDateTime type="localTime" pattern="HH:mm"/>
                        </p:datePicker>
                        <p:messages id="messages" showDetail="true" closable="true" />
                    </h:panelGrid>

                    <h:commandButton value="Lägg till" action="#{eventBean.createEvent}" styleClass="btn btnPrimary">
                        <f:ajax execute="@form" render="eventListForm:eventDisplayArea @form" />
                    </h:commandButton>
                </h:form>

            </div>

            <!-- Calendar for sidebar -->
            <div class="sidebar-area">
                <h:form id="calendarForm">
                    <p:calendar value="#{eventBean.selectedDate}" mode="inline">
                        <p:ajax event="dateSelect" update="eventListForm:eventDisplayArea"/>
                    </p:calendar>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
